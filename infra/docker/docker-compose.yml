services:

  postgres:
    image: postgres:18-alpine
    container_name: nicecomm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nicecomm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - nicecomm_postgres_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: auth-service
    container_name: nicecomm-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nicecomm
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
    ports:
      - "4001:4001"

  participant-service:
