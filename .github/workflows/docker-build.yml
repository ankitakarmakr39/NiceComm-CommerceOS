name: NiceComm Docker Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  docker-build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - participant-service
          - commerce-service
          - order-service
          - warehouse-service
          - packaging-service
          - logistics-service
          - marketing-service
          - affiliate-service
          - inspection-service
          - repair-service
          - installation-service
          - support-service
          - compliance-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.service
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          push: false
          tags: nicecomm/${{ matrix.service }}:ci