name: NiceComm Docker Publish

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        service:
          - api-gateway
          - auth-service
          - participant-service
          - commerce-service
          - order-service
          - warehouse-service
          - packaging-service
          - logistics-service
          - marketing-service
          - affiliate-service
          - inspection-service
          - repair-service
          - installation-service
          - support-service
          - compliance-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.service
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nicecomm-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/nicecomm-${{ matrix.service }}:${{ github.sha }}